name: Build Zarzal Experience APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o ZarzalExperienceAndroid_GitHub_APK.zip -d .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
                run: gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - uses: actions/upload-artifact@v4
        with:
          name: Zarzal-Experience-APK
          path: app/build/outputs/apk/debug/app-debug.apk
